[phases.setup]
cmds = [
  "curl -L https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh",
  "chmod +x dotnet-install.sh",
  "./dotnet-install.sh -c 6.0"
]

[phases.build]
cmds = [
  "dotnet restore SistemaVC-VinosCosteros/SistemaVC-VinosCosteros.csproj",
  "dotnet publish SistemaVC-VinosCosteros/SistemaVC-VinosCosteros.csproj -c Release -o SistemaVC-VinosCosteros/output"
]

[start]
cmd = "cd SistemaVC-VinosCosteros/output && dotnet SistemaVC-VinosCosteros.dll --urls=http://0.0.0.0:$PORT"