[phases]
setup = """
curl -L https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
chmod +x dotnet-install.sh
./dotnet-install.sh -c 6.0
"""

build = """
cd SistemaVC-VinosCosteros
dotnet restore
dotnet publish -c Release -o output
"""

[start]
cmd = "cd SistemaVC-VinosCosteros/output && ./SistemaVC-VinosCosteros --urls=http://0.0.0.0:$PORT"